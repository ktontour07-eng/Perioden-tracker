# Baut die PWA und veroeffentlicht sie auf GitHub Pages.
#
# ACHTUNG: GitHub Pages ist fuer PRIVATE Repositories kostenpflichtig. Solange
# dieses Repo privat und der Plan kostenlos ist, scheitert der Schritt
# "configure-pages" — das ist erwartbar und kein Fehler im Projekt.
#
# Zwei Wege:
#   a) Repository oeffentlich machen (Settings -> General -> Change visibility)
#      und Settings -> Pages -> Source: "GitHub Actions" setzen. Der Quelltext
#      ist dann sichtbar; die Eintraege der App bleiben ausschliesslich auf dem
#      Geraet, im Repo liegen keine Gesundheitsdaten.
#   b) Repo privat lassen und bei Netlify, Vercel oder Cloudflare Pages bauen
#      lassen — die koennen kostenlos aus privaten Repos deployen. Dann wird
#      dieser Workflow nicht gebraucht.
#
# Deshalb laeuft er nur auf Zuruf (Actions -> Pages -> "Run workflow"), nicht
# bei jedem Push: sonst schlaegt jeder Push rot fehl.

name: Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Laufende Deployments nicht abbrechen, aber auch nicht stapeln.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Die Zyklusrechnung ist der Teil, bei dem ein Fehler still bleibt —
      # deshalb laeuft sie vor jedem Deployment.
      - run: npm test

      # GitHub Pages liefert unter /<repo>/ aus, nicht im Wurzelverzeichnis.
      - name: Bauen
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
