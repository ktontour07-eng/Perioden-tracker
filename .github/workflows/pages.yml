# Baut die PWA und veroeffentlicht sie auf GitHub Pages.
#
# Voraussetzung (einmalig): Settings -> Pages -> Source: "GitHub Actions".
# Fuer private Repositories ist Pages kostenpflichtig — schlaegt der Schritt
# "configure-pages" fehl, ist das der Grund, nicht das Projekt.
#
# GitHub Pages liefert unter /<repo>/ aus statt im Wurzelverzeichnis; der
# Buildpfad kommt deshalb ueber BASE_PATH aus dem Repo-Namen.

name: Pages

on:
  push:
    branches: ['main', 'claude/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Laufende Deployments nicht abbrechen, aber auch nicht stapeln.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Die Zyklusrechnung ist der Teil, bei dem ein Fehler still bleibt —
      # deshalb laeuft sie vor jedem Deployment.
      - run: npm test

      # GitHub Pages liefert unter /<repo>/ aus, nicht im Wurzelverzeichnis.
      - name: Bauen
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
