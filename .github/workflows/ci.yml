# Tests und Produktionsbuild fuer Pull Requests und auf Zuruf.
#
# Bei Push auf die Entwicklungszweige uebernimmt das der Pages-Workflow, der
# vor dem Deployment ohnehin testet und baut — sonst liefe alles doppelt.

name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Zyklusrechnung und Auswertung — der Teil, bei dem ein Fehler still bliebe.
      - run: npm test

      - run: npm run build
